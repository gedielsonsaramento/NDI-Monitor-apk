plugins {
    id 'com.android.application'
}

// Optional local debug build using unchanged native files from a verified APK.
// Release builds always use the SDK/CMake integration below.
def nativeReuse = providers.gradleProperty('monitorPrebuiltNativeDir').orNull

android {
    namespace 'br.com.polegar.ndimonitor'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'br.com.polegar.ndimonitor'
        minSdk 23
        targetSdk 36
        versionCode 8
        versionName '1.4.3'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                // The receiver is gated to API 24+; Android 6 uses HTML only.
                arguments '-DANDROID_PLATFORM=android-24'
            }
        }
    }

    buildTypes {
        tvboxTest {
            initWith debug
            applicationIdSuffix '.tvboxtest'
            versionNameSuffix '-tvbox'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    if (nativeReuse) {
        sourceSets.main.jniLibs.srcDirs = [nativeReuse]
    } else {
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

if (nativeReuse) {
    androidComponents {
        beforeVariants(selector().withBuildType('release')) { variant -> variant.enable = false }
    }
    tasks.register('verifyReusedNative') {
        doLast {
            def required = ['armeabi-v7a', 'arm64-v8a'].collectMany { abi ->
                ['libndi.so', 'libndimonitor.so'].collect { lib -> file("${nativeReuse}/${abi}/${lib}") }
            }
            if (required.any { !it.isFile() }) {
                throw new GradleException('Reuso nativo incompleto: forneca as quatro bibliotecas do APK verificado.')
            }
        }
    }
    tasks.matching { it.name == 'preBuild' }.configureEach {
        dependsOn tasks.named('verifyReusedNative')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

tasks.register('verifyReleaseNdiSdk') {
    doLast {
        def required = [
            'src/main/cpp/include/Processing.NDI.Lib.h',
            'src/main/assets/libndi_licenses.txt'
        ] + android.defaultConfig.ndk.abiFilters.collect {
            "src/main/jniLibs/${it}/libndi.so"
        }
        def missing = required.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("SDK NDI incompleto para release: ${missing.join(', ')}")
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('verifyReleaseNdiSdk')
}
