plugins {
    id 'com.android.application'
}

// Optional local debug build using unchanged native files from a verified APK.
// Release builds always use the SDK/CMake integration below.
def nativeReuse = providers.gradleProperty('monitorPrebuiltNativeDir').orNull
def supportEndpoint = providers.gradleProperty('monitorSupportEndpoint').getOrElse('')

android {
    namespace 'br.com.polegar.ndimonitor'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'br.com.polegar.ndimonitor'
        minSdk 23
        targetSdk 36
        versionCode 20
        versionName '1.5.2'
        buildConfigField 'String', 'SUPPORT_ENDPOINT', groovy.json.JsonOutput.toJson(supportEndpoint)

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                // The receiver is gated to API 24+; Android 6 uses HTML only.
                arguments '-DANDROID_PLATFORM=android-24'
            }
        }
    }

    buildTypes {
        tvboxTest {
            initWith debug
            applicationIdSuffix '.tvboxtest'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    if (nativeReuse) {
        sourceSets.main.jniLibs.srcDirs = [nativeReuse]
    } else {
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

if (nativeReuse) {
    androidComponents {
        beforeVariants(selector().withBuildType('release')) { variant -> variant.enable = false }
    }
    tasks.register('verifyReusedNative') {
        doLast {
            def required = ['armeabi-v7a', 'arm64-v8a'].collectMany { abi ->
                ['libndi.so', 'libndimonitor.so'].collect { lib -> file("${nativeReuse}/${abi}/${lib}") }
            }
            if (required.any { !it.isFile() }) {
                throw new GradleException('Reuso nativo incompleto: forneca as quatro bibliotecas do APK verificado.')
            }
        }
    }
    tasks.matching { it.name == 'preBuild' }.configureEach {
        dependsOn tasks.named('verifyReusedNative')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

tasks.register('verifyReleaseNdiSdk') {
    doLast {
        def required = [
            'src/main/cpp/include/Processing.NDI.Lib.h',
            'src/main/assets/libndi_licenses.txt'
        ] + android.defaultConfig.ndk.abiFilters.collect {
            "src/main/jniLibs/${it}/libndi.so"
        }
        def missing = required.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("SDK NDI incompleto para release: ${missing.join(', ')}")
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('verifyReleaseNdiSdk')
}

// TV packages must carry the old-WebView adaptations, not just the adapter code.
tasks.register('verifyHtmlCompat') {
    doLast {
        def manifestFile = file('src/main/assets/html-compat/manifest.json')
        if (!manifestFile.isFile()) throw new GradleException('Perfil HTML ausente: prepare tools/html-compat antes de empacotar para TV.')
        def profile = new groovy.json.JsonSlurper().parse(manifestFile)
        if (profile.schema != 1 || profile.resources.size() != 2) throw new GradleException('Perfil HTML invalido.')
        profile.resources.each { resource ->
            if (!(resource.asset ==~ /html-compat\/[A-Za-z0-9._-]+/) || resource.asset.contains('..'))
                throw new GradleException('Caminho HTML invalido.')
            def asset = file("src/main/assets/${resource.asset}")
            if (!asset.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString() != resource.assetSha256)
                throw new GradleException("Perfil HTML incompleto ou alterado: ${resource.asset}")
        }
        if (!file('src/main/assets/html-compat/NOTICE.txt').isFile()) throw new GradleException('Avisos do perfil HTML ausentes.')
    }
}
tasks.matching { it.name in ['mergeTvboxTestAssets', 'mergeReleaseAssets'] }.configureEach {
    dependsOn tasks.named('verifyHtmlCompat')
}
