plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.polegar.ndimonitor'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.polegar.ndimonitor'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.2.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

// Nunca publique um bundle em modo de preparação, sem a biblioteca NDI real.
tasks.register('verifyReleaseNdiSdk') {
    doLast {
        def required = [
                'src/main/cpp/include/Processing.NDI.Lib.h',
                'src/main/jniLibs/arm64-v8a/libndi.so',
                'src/main/jniLibs/armeabi-v7a/libndi.so',
                'src/main/assets/libndi_licenses.txt'
        ]
        def missing = required.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("SDK NDI incompleto; release bloqueado. Arquivos ausentes: ${missing.join(', ')}")
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('verifyReleaseNdiSdk')
}
