plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.polegar.ndimonitor'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'br.com.polegar.ndimonitor'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

tasks.register('verifyReleaseNdiSdk') {
    doLast {
        def required = [
            'src/main/cpp/include/Processing.NDI.Lib.h',
            'src/main/assets/libndi_licenses.txt'
        ] + android.defaultConfig.ndk.abiFilters.collect {
            "src/main/jniLibs/${it}/libndi.so"
        }
        def missing = required.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("SDK NDI incompleto para release: ${missing.join(', ')}")
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('verifyReleaseNdiSdk')
}
